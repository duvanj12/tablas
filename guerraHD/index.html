<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>La Guerra en HD</title>
  <link rel="stylesheet" href="stilo.css" />
</head>
<body>
  <div class="contenedor">
    <h1>La Guerra en HD</h1>

    <div class="panel-principal">

      <!--Panel Izquierdo: Configuración -->
      <div class="panel panel-formularios">

        <!-- formulario submarino -->
        <div class="seccion">
          <h3>Formulario de vida del submarino</h3>

          <!-- Imagen del submarino centrada -->
          <div class="imagen-unidad" style="text-align: center; margin-bottom: 10px;">
            <img src="img/submarino.jpg" alt="Submarino" class="img-submarino" style="width: 80px; border-radius: 8px;" />
          </div>

          <!-- Inputs para vida y ataque -->
          Vida: <input type="number" id="vidaSubmarino" value="2500" /><br/><br/>
          Ataque: <input type="number" id="ataqueSubmarino" value="500" /><br/><br/>
          <button onclick="guardarSubmarino()">Guardar</button>
        </div>

        <!-- formulario para las unidades -->
        <div class="seccion">
          <h3>Formulario de cálculo de vida y ataque unidades</h3>
          <div id="configTropas"></div>
          <button onclick="guardarTropas()">Guardar</button>
        </div>

        <div class="botones">
          <button class="btn-morado" onclick="crearEjercitos()">Crear Ejércitos</button>
        </div>
      </div>

      <!-- Panel Centro: Información de Ejércitos -->
      <div class="panel panel-ejercitos">
        <h3>Ejércitos Generados</h3>
        <div id="infoEjercitos"></div>
        <div class="botones">
          <button class="btn-rojo" onclick="pelear()">Fight!</button>
        </div>
      </div>

      <!-- Panel Derecho: Log e Informe -->
      <div class="panel panel-log">
        <h3>Log y Informe Final</h3>
        <div id="logBatalla"></div>
        <div id="estadisticasFinales"></div>
        <div class="botones">
          <button class="btn-celeste" id="btnNuevaGuerra" onclick="location.reload()" disabled>Nueva Guerra</button>
        </div>
      </div>

    </div>
  </div>

  <script src="guerraHD.js"></script>
</body>
</html>
